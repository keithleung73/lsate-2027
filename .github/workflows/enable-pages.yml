name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from branch main /
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if gh api "repos/${repo}/pages" > /tmp/pages.json; then
            echo "Pages site already exists"
            cat /tmp/pages.json
            exit 0
          fi
          gh api --method POST "repos/${repo}/pages" --input - <<'JSON'
          {
            "build_type": "legacy",
            "source": {
              "branch": "main",
              "path": "/"
            }
          }
          JSON
